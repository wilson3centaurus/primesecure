name: Agent (signed release APK)

# Builds the release-signed agent. Run it from Actions → "Agent (signed release APK)" → Run workflow,
# then upload the APK on the dashboard's Agent updates page; devices install it at their next check-in.
#
# Repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   AGENT_KEYSTORE_BASE64   base64 of the release keystore (.jks)
#   AGENT_KEYSTORE_PASSWORD, AGENT_KEY_ALIAS, AGENT_KEY_PASSWORD
# Repository variables: PRIMESECURE_URL, PRIMESECURE_ANON_KEY (same as the debug build).

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name, e.g. 1.0.0"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore
        env:
          AGENT_KEYSTORE_BASE64: ${{ secrets.AGENT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$AGENT_KEYSTORE_BASE64" ]; then echo "::error::AGENT_KEYSTORE_BASE64 secret is not set"; exit 1; fi
          echo "$AGENT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build and lint release APK
        env:
          PRIMESECURE_URL: ${{ vars.PRIMESECURE_URL }}
          PRIMESECURE_ANON_KEY: ${{ vars.PRIMESECURE_ANON_KEY }}
          AGENT_VERSION_NAME: ${{ inputs.version_name }}
          AGENT_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          AGENT_KEYSTORE_PASSWORD: ${{ secrets.AGENT_KEYSTORE_PASSWORD }}
          AGENT_KEY_ALIAS: ${{ secrets.AGENT_KEY_ALIAS }}
          AGENT_KEY_PASSWORD: ${{ secrets.AGENT_KEY_PASSWORD }}
        run: |
          # Release version codes count up from 1000, above any debug build.
          export AGENT_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          ./gradlew assembleRelease lintRelease --no-daemon

      - name: Name the APK after its version
        id: apk
        run: |
          code=$((1000 + GITHUB_RUN_NUMBER))
          name="primesecure-${{ inputs.version_name }}-$code.apk"
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/$name"
          sha=$(sha256sum "app/build/outputs/apk/release/$name" | cut -d' ' -f1)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "### $name" >> "$GITHUB_STEP_SUMMARY"
          echo "version code \`$code\` · sha256 \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: agent/app/build/outputs/apk/release/*.apk
